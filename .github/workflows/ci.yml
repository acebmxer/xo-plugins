name: CI

# Each plugin's package.json is checked for validity and its JS for syntax
# errors, then any plugin with a "test" script (both do, as of the node:test
# suites under test/) has that script run. No lint config exists yet for
# either plugin.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate each plugin's package.json
        run: |
          set -euo pipefail
          for pkg in */package.json; do
            echo "Checking ${pkg}"
            node -e "JSON.parse(require('fs').readFileSync('${pkg}', 'utf8'))"
          done

      - name: Check JS syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}" || status=1
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          exit "${status}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run each plugin's test script, where it has one
        run: |
          set -euo pipefail
          for pkg in */package.json; do
            dir=$(dirname "${pkg}")
            has_test_script=$(node -e "const s=require('./${pkg}').scripts; console.log(s && s.test ? 'yes' : 'no')")
            if [ "${has_test_script}" = "yes" ]; then
              echo "Testing ${dir}"
              (cd "${dir}" && npm test)
            else
              echo "No test script for ${dir}, skipping"
            fi
          done
