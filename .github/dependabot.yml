version: 2
updates:
  # Keep the GitHub Actions used in CI (e.g. actions/checkout) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/xo-server-nanokvm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(nanokvm)"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/xo-server-host-power-manager"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(host-power-manager)"
    labels:
      - "dependencies"
